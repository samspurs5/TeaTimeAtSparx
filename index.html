<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeaTime@Sparx</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInDocument()"></script>
<style>
  :root {
    --navy: #1a1f3a;
    --purple: #3d2b8e;
    --purple-light: #5a3fbf;
    --accent: #7c5cbf;
    --green: #2ecc71;
    --red: #e74c3c;
    --gold: #f1c40f;
    --bg: #f0f2f8;
    --card: #ffffff;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --border: #e0e4f0;
    --shadow: 0 2px 16px rgba(61,43,142,0.10);
    --shadow-hover: 0 6px 32px rgba(61,43,142,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--purple) 100%);
    color: white;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .logo {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--gold);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .stat-chip {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-chip .icon { font-size: 1rem; }

  /* MAIN CONTENT */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  /* HOME SCREEN */
  #home-screen { display: block; }
  #task-screen { display: none; }

  .section-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
  }
  .section-subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  /* TOPIC CARDS GRID */
  .topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }
  .topic-card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .topic-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
  }
  .topic-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--topic-color, var(--purple));
  }
  .topic-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 14px;
    background: var(--topic-bg, #ede9ff);
  }
  .topic-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .topic-count {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .progress-bar-wrap {
    background: var(--border);
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 10px;
    background: var(--topic-color, var(--purple));
    transition: width 0.5s ease;
  }
  .progress-label {
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .topic-badge {
    position: absolute;
    top: 16px; right: 16px;
    background: var(--topic-color, var(--purple));
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* LEADERBOARD/STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 36px;
  }
  .stats-tile {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stats-tile .big-num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--purple);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stats-tile .label {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 500;
  }

  /* TASK SCREEN */
  .task-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }
  .back-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--navy);
    transition: background 0.1s, border-color 0.1s;
    display: flex; align-items: center; gap: 6px;
  }
  .back-btn:hover { background: var(--bg); border-color: var(--accent); }
  .task-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--navy);
    flex: 1;
  }
  .task-progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
  }
  .task-progress-bar {
    width: 140px;
    height: 8px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .task-progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--accent));
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 40px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    max-width: 760px;
  }
  .question-meta {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-topic { background: #ede9ff; color: var(--purple); }
  .badge-easy { background: #d5f5e3; color: #27ae60; }
  .badge-medium { background: #fef9e7; color: #d68910; }
  .badge-hard { background: #fde8e8; color: #c0392b; }
  .question-num {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .question-text {
    font-size: 1.08rem;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 28px;
  }
  .answer-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .answer-input {
    padding: 12px 18px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1.05rem;
    font-family: inherit;
    outline: none;
    width: 200px;
    transition: border-color 0.15s;
    color: var(--text);
    background: var(--bg);
  }
  .answer-input:focus { border-color: var(--accent); background: white; }
  .answer-input.correct { border-color: var(--green); background: #f0fff4; }
  .answer-input.incorrect { border-color: var(--red); background: #fff5f5; }
  .btn {
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.1s, box-shadow 0.1s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    color: white;
    box-shadow: 0 4px 14px rgba(61,43,142,0.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(61,43,142,0.4); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-next {
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: white;
    box-shadow: 0 4px 14px rgba(46,204,113,0.3);
    display: none;
  }
  .btn-next:hover { box-shadow: 0 6px 20px rgba(46,204,113,0.4); }

  /* FEEDBACK */
  .feedback-box {
    margin-top: 20px;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 10px;
  }
  .feedback-correct {
    background: #d5f5e3;
    color: #1d8348;
    border: 1.5px solid #82e0aa;
  }
  .feedback-incorrect {
    background: #fde8e8;
    color: #922b21;
    border: 1.5px solid #f1948a;
  }
  .feedback-icon { font-size: 1.3rem; }

  /* XP ANIMATION */
  .xp-pop {
    position: fixed;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--gold);
    pointer-events: none;
    z-index: 999;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    animation: xpFloat 1.2s ease-out forwards;
  }
  @keyframes xpFloat {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }

  /* COMPLETION CARD */
  .completion-card {
    background: linear-gradient(135deg, var(--navy), var(--purple));
    color: white;
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    max-width: 600px;
    box-shadow: var(--shadow-hover);
  }
  .completion-card .big-trophy { font-size: 4rem; margin-bottom: 16px; }
  .completion-card h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
  .completion-card p { opacity: 0.85; font-size: 1rem; margin-bottom: 24px; }
  .completion-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
  }
  .completion-stat .num {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--gold);
  }
  .completion-stat .lbl {
    font-size: 0.82rem;
    opacity: 0.7;
    margin-top: 2px;
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    header { padding: 0 16px; }
    .logo { font-size: 1.1rem; }
    .stat-chip { padding: 5px 10px; font-size: 0.75rem; }
    main { padding: 20px 12px; }
    .question-card { padding: 24px 20px; }
    .topic-grid { grid-template-columns: 1fr; }
    .answer-row { flex-direction: column; align-items: flex-start; }
    .answer-input { width: 100%; }
    .btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">☕</div>
    TeaTime@Sparx
  </div>
  <div class="header-stats">
    <div class="stat-chip"><span class="icon">⭐</span> <span id="header-xp">0</span> XP</div>
    <div class="stat-chip"><span class="icon">🔥</span> <span id="header-streak">0</span> streak</div>
  </div>
</header>

<main>

  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="section-title">Team Time at Cambridge</div>
    <div class="section-subtitle">Olympiad-style maths challenges. Choose a topic to begin your session.</div>

    <div class="stats-row" id="stats-row"></div>

    <div style="font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:16px;">Topics</div>
    <div class="topic-grid" id="topic-grid"></div>
  </div>

  <!-- TASK SCREEN -->
  <div id="task-screen">
    <div class="task-header">
      <button class="back-btn" onclick="goHome()">&#8592; Topics</button>
      <div class="task-title" id="task-title"></div>
      <div class="task-progress-wrap">
        <span id="task-progress-text"></span>
        <div class="task-progress-bar">
          <div class="task-progress-bar-fill" id="task-progress-fill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div id="question-area"></div>
  </div>

</main>

// ============================================================
// TOPIC METADATA
// ============================================================
const TOPIC_META = {
  "Number Theory":  { icon: "🔢", color: "#3d2b8e", bg: "#ede9ff" },
  "Algebra":        { icon: "📐", color: "#1a6fad", bg: "#e8f4fd" },
  "Geometry":       { icon: "📏", color: "#0e8a4a", bg: "#e8f8f1" },
  "Combinatorics":  { icon: "🎲", color: "#b7500f", bg: "#fef0e7" },
  "Logic & Puzzles":{ icon: "🧩", color: "#8e3d80", bg: "#fde9fa" },
  "Warm-Up":        { icon: "🌅", color: "#c47d00", bg: "#fff8e6" },
};

// ============================================================
// STATE
// ============================================================
let state = {
  xp: 0,
  streak: 0,
  topicProgress: {}, // { topicName: { answered: Set of q ids, correct: Set } }
};

function loadState() {
  try {
    const saved = localStorage.getItem("teatime_sparx_state");
    if (saved) {
      const parsed = JSON.parse(saved);
      state.xp = parsed.xp || 0;
      state.streak = parsed.streak || 0;
      // Rebuild Sets
      state.topicProgress = {};
      for (const [t, v] of Object.entries(parsed.topicProgress || {})) {
        state.topicProgress[t] = {
          answered: new Set(v.answered || []),
          correct: new Set(v.correct || [])
        };
      }
    }
  } catch(e) {}
}

function saveState() {
  const ser = {
    xp: state.xp,
    streak: state.streak,
    topicProgress: {}
  };
  for (const [t, v] of Object.entries(state.topicProgress)) {
    ser.topicProgress[t] = {
      answered: [...v.answered],
      correct: [...v.correct]
    };
  }
  localStorage.setItem("teatime_sparx_state", JSON.stringify(ser));
}

function getTopicProgress(topic) {
  if (!state.topicProgress[topic]) {
    state.topicProgress[topic] = { answered: new Set(), correct: new Set() };
  }
  return state.topicProgress[topic];
}

// ============================================================
// CURRENT TASK SESSION
// ============================================================
let session = {
  topic: null,
  questions: [],
  index: 0,
  sessionCorrect: 0,
  sessionAnswered: 0,
  done: false
};

// ============================================================
// UI HELPERS
// ============================================================
function updateHeader() {
  document.getElementById("header-xp").textContent = state.xp;
  document.getElementById("header-streak").textContent = state.streak;
}

function renderMathInElement2(el) {
  if (typeof renderMathInElement !== "undefined") {
    renderMathInElement(el, {
      delimiters: [
        {left: "\\(", right: "\\)", display: false},
        {left: "\\[", right: "\\]", display: true},
        {left: "$", right: "$", display: false},
      ],
      throwOnError: false
    });
  }
}

// ============================================================
// HOME SCREEN
// ============================================================
function buildHome() {
  // Stats row
  const allAnswered = Object.values(state.topicProgress).reduce((s, v) => s + v.answered.size, 0);
  const allCorrect = Object.values(state.topicProgress).reduce((s, v) => s + v.correct.size, 0);
  const accuracy = allAnswered > 0 ? Math.round(100 * allCorrect / allAnswered) : 0;
  const statsRow = document.getElementById("stats-row");
  statsRow.innerHTML = `
    <div class="stats-tile"><div class="big-num">${state.xp}</div><div class="label">Total XP</div></div>
    <div class="stats-tile"><div class="big-num">${state.streak}</div><div class="label">Current Streak</div></div>
    <div class="stats-tile"><div class="big-num">${allAnswered}</div><div class="label">Questions Answered</div></div>
    <div class="stats-tile"><div class="big-num">${accuracy}%</div><div class="label">Accuracy</div></div>
  `;

  // Topic cards
  const topics = [...new Set(QUESTIONS.map(q => q.topic))];
  const grid = document.getElementById("topic-grid");
  grid.innerHTML = "";
  for (const topic of topics) {
    const meta = TOPIC_META[topic] || { icon: "📖", color: "#555", bg: "#eee" };
    const qs = QUESTIONS.filter(q => q.topic === topic);
    const prog = getTopicProgress(topic);
    const answered = prog.answered.size;
    const total = qs.length;
    const pct = total > 0 ? Math.round(100 * answered / total) : 0;
    const card = document.createElement("div");
    card.className = "topic-card";
    card.style.setProperty("--topic-color", meta.color);
    card.style.setProperty("--topic-bg", meta.bg);
    card.innerHTML = `
      <div class="topic-badge">${qs.filter(q=>q.difficulty==="Hard").length} hard</div>
      <div class="topic-icon">${meta.icon}</div>
      <div class="topic-name">${topic}</div>
      <div class="topic-count">${total} questions · ${answered} completed</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
      <div class="progress-label"><span>${pct}% complete</span><span>${answered}/${total}</span></div>
    `;
    card.addEventListener("click", () => startTask(topic));
    grid.appendChild(card);
  }
}

// ============================================================
// TASK SESSION
// ============================================================
function startTask(topic) {
  const qs = QUESTIONS.filter(q => q.topic === topic);
  session.topic = topic;
  session.questions = shuffleArr([...qs]);
  session.index = 0;
  session.sessionCorrect = 0;
  session.sessionAnswered = 0;
  session.done = false;

  document.getElementById("home-screen").style.display = "none";
  document.getElementById("task-screen").style.display = "block";

  const meta = TOPIC_META[topic] || {};
  document.getElementById("task-title").textContent = `${meta.icon || ""} ${topic}`;

  showQuestion();
}

function showQuestion() {
  const q = session.questions[session.index];
  const total = session.questions.length;
  const idx = session.index;

  document.getElementById("task-progress-text").textContent = `${idx + 1} / ${total}`;
  document.getElementById("task-progress-fill").style.width = `${Math.round(100 * idx / total)}%`;

  const diffClass = { Easy: "badge-easy", Medium: "badge-medium", Hard: "badge-hard" }[q.difficulty] || "badge-medium";

  const area = document.getElementById("question-area");
  area.innerHTML = `
    <div class="question-card" id="q-card">
      <div class="question-meta">
        <span class="badge badge-topic">${q.topic}</span>
        <span class="badge ${diffClass}">${q.difficulty}</span>
      </div>
      <div class="question-num">Question ${idx + 1} of ${total}</div>
      <div class="question-text" id="q-text">${q.text}</div>
      <div class="answer-row">
        <input type="text" id="answer-input" class="answer-input" placeholder="Your answer…" autocomplete="off" />
        <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()">Check</button>
        <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">Next →</button>
      </div>
      <div class="feedback-box" id="feedback-box"></div>
    </div>
  `;

  // Render math
  const textEl = document.getElementById("q-text");
  renderMathInElement2(textEl);

  // Enter key submits
  document.getElementById("answer-input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const nextBtn = document.getElementById("next-btn");
      if (nextBtn.style.display === "inline-flex" || nextBtn.style.display === "flex" || nextBtn.style.display === "block") {
        nextQuestion();
      } else {
        submitAnswer();
      }
    }
  });

  document.getElementById("answer-input").focus();
}

function normaliseAnswer(s) {
  return s.trim().toLowerCase().replace(/\s+/g, "").replace(/,/g, "");
}

function checkAnswer(userRaw, correct) {
  const user = normaliseAnswer(userRaw);
  const corr = normaliseAnswer(correct);
  if (user === corr) return true;
  // Try numeric comparison with tolerance
  const uNum = parseFloat(user);
  const cNum = parseFloat(corr);
  if (!isNaN(uNum) && !isNaN(cNum)) {
    return Math.abs(uNum - cNum) < 0.01;
  }
  return false;
}

function submitAnswer() {
  const q = session.questions[session.index];
  const inputEl = document.getElementById("answer-input");
  const submitBtn = document.getElementById("submit-btn");
  const nextBtn = document.getElementById("next-btn");
  const feedbackBox = document.getElementById("feedback-box");

  const userAnswer = inputEl.value.trim();
  if (!userAnswer) { inputEl.focus(); return; }

  const isCorrect = checkAnswer(userAnswer, q.answer);

  // Update state
  const prog = getTopicProgress(q.topic);
  prog.answered.add(q.id);
  session.sessionAnswered++;

  if (isCorrect) {
    prog.correct.add(q.id);
    state.xp += 10;
    state.streak++;
    session.sessionCorrect++;
    inputEl.classList.add("correct");
    feedbackBox.className = "feedback-box feedback-correct";
    feedbackBox.innerHTML = `<span class="feedback-icon">✅</span> <span>Correct! +10 XP</span>`;
    feedbackBox.style.display = "flex";
    showXpPop(inputEl, "+10 XP");
  } else {
    state.streak = 0;
    inputEl.classList.add("incorrect");
    feedbackBox.className = "feedback-box feedback-incorrect";
    feedbackBox.innerHTML = `<span class="feedback-icon">❌</span> <span>Not quite. The answer is <strong>${q.answer}</strong>.</span>`;
    feedbackBox.style.display = "flex";
  }

  inputEl.disabled = true;
  submitBtn.style.display = "none";
  nextBtn.style.display = "inline-flex";
  nextBtn.focus();

  updateHeader();
  saveState();
}

function nextQuestion() {
  session.index++;
  if (session.index >= session.questions.length) {
    showCompletion();
  } else {
    showQuestion();
  }
}

function showCompletion() {
  const topic = session.topic;
  const correct = session.sessionCorrect;
  const total = session.questions.length;
  const xpEarned = correct * 10;

  const area = document.getElementById("question-area");
  area.innerHTML = `
    <div class="completion-card">
      <div class="big-trophy">🏆</div>
      <h2>Topic Complete!</h2>
      <p>You've finished all ${total} questions in <strong>${topic}</strong>.</p>
      <div class="completion-stats">
        <div class="completion-stat"><div class="num">${correct}/${total}</div><div class="lbl">Correct</div></div>
        <div class="completion-stat"><div class="num">${xpEarned}</div><div class="lbl">XP Earned</div></div>
        <div class="completion-stat"><div class="num">${Math.round(100*correct/total)}%</div><div class="lbl">Score</div></div>
      </div>
      <button class="btn btn-primary" onclick="goHome()" style="margin-right:12px">← Back to Topics</button>
      <button class="btn btn-next" style="display:inline-flex" onclick="startTask('${topic}')">Retry Topic</button>
    </div>
  `;

  document.getElementById("task-progress-text").textContent = `${total} / ${total}`;
  document.getElementById("task-progress-fill").style.width = "100%";
}

function goHome() {
  document.getElementById("task-screen").style.display = "none";
  document.getElementById("home-screen").style.display = "block";
  buildHome();
}

// ============================================================
// UTILS
// ============================================================
function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showXpPop(nearEl, text) {
  const rect = nearEl.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "xp-pop";
  pop.textContent = text;
  pop.style.left = (rect.left + 10) + "px";
  pop.style.top = (rect.top + window.scrollY) + "px";
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1300);
}

function renderMathInDocument() {
  // Called by KaTeX auto-render onload
  // Will render any math already on page; dynamic content is handled per-element
}

// ============================================================
// INIT
// ============================================================
loadState();
updateHeader();
buildHome();
</script>
